<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Почини трубы!</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:#dff4ff;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:100vw;
    height:100vh;
    max-width:177.78vh;
    max-height:56.25vw;

    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;

    padding:1.2vh 1.8vw;

    background-image:
        linear-gradient(
            rgba(255,255,255,.10),
            rgba(255,255,255,.10)
        ),
        url("fon.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    flex:0 0 auto;
    z-index:5;
}

.header h1{
    margin:0;

    color:#326f92;

    font-size:clamp(26px,2.7vw,46px);
    font-weight:900;

    text-shadow:
        0 2px 0 rgba(255,255,255,.8);
}

.header p{
    margin:.1em 0 .15em;

    color:#55788d;

    font-size:clamp(12px,1.1vw,17px);
    font-weight:700;
}

.level-info{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:10px;

    margin:.25em 0 .15em;
}

.level-text{
    padding:.25em .8em;

    border-radius:999px;

    background:rgba(255,255,255,.78);

    color:#6b5ba7;

    font-weight:900;

    font-size:clamp(13px,1.15vw,18px);
}

.dots{
    display:flex;
    gap:6px;
}

.dot{
    width:12px;
    height:12px;

    border-radius:50%;

    background:#d9cff2;

    border:2px solid white;
}

.dot.active{
    background:#7658b1;
    transform:scale(1.2);
}

/* =========================
   ОСНОВНАЯ ОБЛАСТЬ
========================= */

.game-area{
    flex:1;
    min-height:0;

    display:grid;

    grid-template-columns:
        minmax(190px,1.15fr)
        minmax(600px,2.8fr)
        minmax(190px,1.15fr);

    gap:clamp(16px,2vw,34px);

    align-items:center;
}

/* =========================
   БОКОВЫЕ ПАНЕЛИ
========================= */

.side-panel{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:clamp(8px,1.1vh,14px);
}

/* =========================
   РЕЧЕВЫЕ КАРТОЧКИ
========================= */

.speech-card{
    width:100%;
    max-width:225px;

    flex:1;

    max-height:145px;
    min-height:80px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    border-radius:25px;

    background:rgba(255,255,255,.94);

    border:5px solid white;

    box-shadow:
        0 9px 23px rgba(55,100,130,.18);

    transition:.35s;
}

.card-cover{
    position:absolute;
    inset:0;

    z-index:5;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            145deg,
            #d8caf7,
            #eee8ff
        );

    color:#7558ae;

    font-size:clamp(38px,4vw,68px);

    font-weight:900;

    transition:.35s;
}

.card-picture{
    width:90%;
    height:90%;

    object-fit:contain;

    opacity:0;

    transform:scale(.35);

    transition:.4s;
}

.card-emoji{
    font-size:clamp(42px,4.8vw,76px);

    opacity:0;

    transform:scale(.35);

    transition:.4s;
}

.speech-card.revealed{
    border-color:#83d49a;

    transform:scale(1.03);

    box-shadow:
        0 10px 27px rgba(60,155,90,.23);
}

.speech-card.revealed .card-cover{
    opacity:0;
    transform:scale(1.4);

    pointer-events:none;
}

.speech-card.revealed .card-picture,
.speech-card.revealed .card-emoji{
    opacity:1;

    transform:scale(1);

    animation:picturePop .45s ease;
}

@keyframes picturePop{
    0%{
        transform:scale(.3);
    }

    70%{
        transform:scale(1.18);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================
   ЦЕНТР
========================= */

.center{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    min-width:0;
}

/* =========================
   ИГРОВОЕ ПОЛЕ
========================= */

.board{
    display:grid;

    gap:0;

    padding:22px;

    position:relative;

    background:rgba(255,255,255,.70);

    border:4px solid rgba(255,255,255,.88);

    border-radius:34px;

    box-shadow:
        0 18px 42px rgba(50,100,130,.20);
}

.cell{
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:visible;

    cursor:pointer;
}

.cell.empty{
    cursor:default;
}

/* правильную трубу НЕ подсвечиваем зелёным,
   чтобы ребёнок ориентировался по открывшейся картинке */

.cell.correct{
    background:transparent;
}

/* =========================
   PNG ТРУБЫ
========================= */

.pipe-image{
    position:absolute;

    width:108%;
    height:108%;

    left:-4%;
    top:-4%;

    object-fit:contain;

    pointer-events:none;

    transform-origin:50% 50%;

    transition:transform .25s ease;

    z-index:2;

    filter:
        drop-shadow(
            0 5px 5px rgba(25,80,125,.16)
        );
}

/* =========================
   ВОДА ПОВЕРХ PNG
========================= */

.water-layer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;

    pointer-events:none;

    z-index:3;

    transform-origin:50% 50%;

    transition:transform .25s ease;
}

.water-path{
    fill:none;

    stroke:#56d7ff;

    stroke-width:12;

    stroke-linecap:round;
    stroke-linejoin:round;

    opacity:0;

    filter:
        drop-shadow(
            0 0 5px rgba(0,170,255,.95)
        );
}

.cell.water-on .water-path{
    opacity:.95;

    stroke-dasharray:15 10;

    animation:
        waterMove .42s linear infinite;
}

@keyframes waterMove{
    from{
        stroke-dashoffset:25;
    }

    to{
        stroke-dashoffset:0;
    }
}

/* =========================
   СТАРТ / ФИНИШ
========================= */

.endpoint{
    cursor:default;
    z-index:5;
}

.endpoint-box{
    width:94%;
    height:94%;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:25px;

    background:rgba(255,255,255,.88);

    box-shadow:
        0 8px 20px rgba(50,100,130,.15);
}

.start .endpoint-box{
    border:4px solid #83d49a;
}

.finish .endpoint-box{
    border:4px solid #ffd16d;
}

.endpoint-picture{
    width:88%;
    height:88%;

    object-fit:contain;

    position:relative;

    z-index:2;
}

.start .endpoint-picture{
    width:96%;
    height:96%;
}

/* =========================
   РОСТ ЦВЕТКА
========================= */

.plant{
    transition:
        opacity .25s ease,
        transform .35s ease;
}

.plant.growing{
    animation:
        plantGrow .95s cubic-bezier(.2,.8,.2,1);
}

@keyframes plantGrow{

    0%{
        opacity:0;
        transform:
            translateY(30%)
            scale(.25);
    }

    55%{
        opacity:1;

        transform:
            translateY(-6%)
            scale(1.16);
    }

    75%{
        transform:
            translateY(0)
            scale(.94)
            rotate(-3deg);
    }

    88%{
        transform:
            scale(1.05)
            rotate(3deg);
    }

    100%{
        opacity:1;

        transform:
            scale(1)
            rotate(0);
    }
}

/* =========================
   КАПЕЛЬКИ У ФИНИША
========================= */

.splash{
    position:absolute;

    left:50%;
    top:50%;

    width:10px;
    height:15px;

    border-radius:
        60% 60% 70% 70%;

    background:#36c9ff;

    opacity:0;

    z-index:10;

    pointer-events:none;
}

.finish.splash-on .splash{
    animation:
        splash .8s ease-out forwards;
}

.splash.s1{
    --x:-50px;
    --y:-55px;
}

.splash.s2{
    --x:45px;
    --y:-62px;
}

.splash.s3{
    --x:-65px;
    --y:-15px;
}

.splash.s4{
    --x:60px;
    --y:-12px;
}

.splash.s5{
    --x:0px;
    --y:-78px;
}

@keyframes splash{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);
    }
}

/* =========================
   ПОДСКАЗКА
========================= */

.hint{
    margin-top:1vh;

    padding:.5em 1.4em;

    background:rgba(255,255,255,.88);

    border-radius:999px;

    color:#55778b;

    font-size:clamp(12px,1.1vw,17px);

    font-weight:700;

    box-shadow:
        0 5px 15px rgba(50,100,130,.08);
}

/* =========================
   ПОБЕДА
========================= */

.win{
    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(220,246,255,.68);

    backdrop-filter:blur(7px);
}

.win.show{
    display:flex;
}

.win-card{
    width:min(65%,600px);

    padding:3.5vh 4vw;

    text-align:center;

    background:white;

    border-radius:36px;

    box-shadow:
        0 20px 55px rgba(50,90,120,.22);

    animation:
        winPop .45s ease;
}

@keyframes winPop{
    from{
        opacity:0;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.win-flower{
    width:min(220px,25vh);

    max-height:230px;

    object-fit:contain;

    animation:
        flowerDance 1.2s ease-in-out infinite alternate;
}

@keyframes flowerDance{
    from{
        transform:
            rotate(-2deg)
            scale(.98);
    }

    to{
        transform:
            rotate(2deg)
            scale(1.04);
    }
}

.win h2{
    margin:.1em 0;

    color:#377c9f;

    font-size:
        clamp(28px,3.6vw,52px);
}

.win p{
    color:#627b89;

    font-size:
        clamp(14px,1.5vw,21px);

    font-weight:700;
}

.win button{
    border:0;

    padding:.8em 2.4em;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            #6cc5e9,
            #369bc8
        );

    color:white;

    font-size:
        clamp(16px,1.6vw,22px);

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(55,120,155,.25);
}

.win button:hover{
    transform:scale(1.04);
}

/* =========================
   МОБИЛЬНАЯ АДАПТАЦИЯ
========================= */

@media(max-width:900px){

    .game-area{
        grid-template-columns:
            115px 1fr 115px;

        gap:7px;
    }

    .speech-card{
        max-width:140px;
    }

    .board{
        padding:10px;
    }
}

</style>
</head>

<body>

<main class="game">

    <div class="header">

        <h1>
            🔧 Почини трубы!
        </h1>

        <p>
            Поворачивай трубы и проведи воду от крана к цветку
        </p>

        <div class="level-info">

            <span
                class="level-text"
                id="levelText">
                Уровень 1 из 4
            </span>

            <div
                class="dots"
                id="dots">
            </div>

        </div>

    </div>


    <div class="game-area">

        <div
            class="side-panel"
            id="leftPanel">
        </div>


        <div class="center">

            <div
                class="board"
                id="board">
            </div>

            <div class="hint">
                💡 Поворачивай трубы. Правильная труба откроет картинку!
            </div>

        </div>


        <div
            class="side-panel"
            id="rightPanel">
        </div>

    </div>


    <div
        class="win"
        id="win">

        <div class="win-card">

            <img
                src="decor/plant-finish.png"
                class="win-flower"
                alt=""
            >

            <h2 id="winTitle">
                Уровень пройден!
            </h2>

            <p id="winText">
                Вода дошла до цветка!
            </p>

            <button id="nextButton">
                Дальше →
            </button>

        </div>

    </div>

</main>


<script>

/* =========================================================
   НАПРАВЛЕНИЯ
========================================================= */

const DIRS=[
    "N",
    "E",
    "S",
    "W"
];

const OPPOSITE={
    N:"S",
    E:"W",
    S:"N",
    W:"E"
};


/* =========================================================
   ПУТИ К ГРАФИКЕ
========================================================= */

const ASSETS={

    faucet:
        "decor/kran.png",

    plantStart:
        "decor/plant-start.png",

    plantFinish:
        "decor/plant-finish.png",

    straight:
        "pipes/straight.png",

    corner:
        "pipes/corner.png"

};


/* =========================================================
   ПОКА ТЕСТОВЫЕ РЕЧЕВЫЕ КАРТИНКИ

   Позже заменим их на твои PNG.
========================================================= */

const pictures=[
    "🎈","🐭","🚗","🧢","🐱",
    "🛞","🧥","🐶","⚽","🚲"
];


/* =========================================================
   4 УРОВНЯ
========================================================= */

const levels=[

/* =========================================================
   УРОВЕНЬ 1 — 6 ТРУБ / 6 КАРТОЧЕК

   🚰 → 1 → 2
            ↓
        6 ← 5
        ↓
        10 → 11 → 🌱

   Компактный маршрут с 6 поворачиваемыми трубами.
========================================================= */
{
    cols:4,
    rows:3,

    startIndex:0,
    startDirection:"E",

    finishIndex:11,
    finishIncoming:"W",

    required:[1,2,6,5,9,10],

    cells:[
        {type:"start"},

        {type:"straight", target:["W","E"], card:0},
        {type:"corner",   target:["W","S"], card:1},
        {type:"empty"},

        {type:"empty"},
        {type:"corner",   target:["E","S"], card:3},
        {type:"corner",   target:["N","W"], card:2},
        {type:"empty"},

        {type:"empty"},
        {type:"corner",   target:["N","E"], card:4},
        {type:"straight", target:["W","E"], card:5},
        {type:"finish"}
    ]
},

/* =========================================================
   УРОВЕНЬ 2 — 8 ТРУБ / 6 КАРТОЧЕК

   Чётное усложнение после первого уровня.
   Две дополнительные трубы не открывают карточки.
========================================================= */
{
    cols:5,
    rows:3,

    startIndex:0,
    startDirection:"E",

    finishIndex:13,
    finishIncoming:"W",

    required:[1,2,3,4,9,8,7,12],

    cells:[
        {type:"start"},
        {type:"straight", target:["W","E"], card:0},
        {type:"straight", target:["W","E"], card:1},
        {type:"straight", target:["W","E"], card:2},
        {type:"corner",   target:["W","S"], card:3},

        {type:"empty"},
        {type:"empty"},
        {type:"corner",   target:["E","S"], card:6},
        {type:"straight", target:["W","E"], card:5},
        {type:"corner",   target:["N","W"], card:4},

        {type:"empty"},
        {type:"empty"},
        {type:"corner",   target:["N","E"], card:7},
        {type:"finish"},
        {type:"empty"}
    ]
},

/* =========================================================
   УРОВЕНЬ 3 — 10 ТРУБ / 6 КАРТОЧЕК

   Самый сложный маршрут: 10 поворачиваемых труб.
   Четыре дополнительные трубы не открывают карточки.
========================================================= */
{
    cols:5,
    rows:4,

    startIndex:0,
    startDirection:"E",

    finishIndex:18,
    finishIncoming:"W",

    required:[1,2,3,4,9,8,7,12,17,18],

    cells:[
        {type:"start"},
        {type:"straight", target:["W","E"], card:0},
        {type:"straight", target:["W","E"], card:1},
        {type:"straight", target:["W","E"], card:2},
        {type:"corner",   target:["W","S"], card:3},

        {type:"empty"},
        {type:"empty"},
        {type:"corner",   target:["E","S"], card:6},
        {type:"straight", target:["W","E"], card:5},
        {type:"corner",   target:["N","W"], card:4},

        {type:"empty"},
        {type:"empty"},
        {type:"straight", target:["N","S"], card:7},
        {type:"empty"},
        {type:"empty"},

        {type:"empty"},
        {type:"empty"},
        {type:"corner",   target:["N","E"], card:8},
        {type:"straight", target:["W","E"], card:9},
        {type:"finish"}
    ]
},



];


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentLevel=0;

let rotations={};

let running=false;

let completed=false;


/* =========================================================
   DOM
========================================================= */

const board=
    document.getElementById(
        "board"
    );

const leftPanel=
    document.getElementById(
        "leftPanel"
    );

const rightPanel=
    document.getElementById(
        "rightPanel"
    );

const win=
    document.getElementById(
        "win"
    );

const levelText=
    document.getElementById(
        "levelText"
    );

const dots=
    document.getElementById(
        "dots"
    );

const winTitle=
    document.getElementById(
        "winTitle"
    );

const winText=
    document.getElementById(
        "winText"
    );

const nextButton=
    document.getElementById(
        "nextButton"
    );


/* =========================================================
   ПОВОРОТ НАПРАВЛЕНИЯ
========================================================= */

function rotateDirection(
    direction,
    rotation
){

    const index=
        DIRS.indexOf(
            direction
        );

    return DIRS[
        (index+rotation)%4
    ];

}


/* =========================================================
   СОЕДИНЕНИЯ
========================================================= */

function getConnections(
    type,
    rotation
){

    let base;

    /*
    Наш straight.png нарисован
    вертикально.
    */

    if(type==="straight"){

        base=[
            "N",
            "S"
        ];

    }

    /*
    Наш corner.png:
    сверху → вправо.
    */

    else{

        base=[
            "N",
            "E"
        ];

    }


    return base.map(
        direction=>
            rotateDirection(
                direction,
                rotation
            )
    );

}


/* =========================================================
   СРАВНЕНИЕ
========================================================= */

function sameConnections(a,b){

    return(
        a.length===b.length &&

        a.every(
            direction=>
                b.includes(direction)
        )
    );

}


/* =========================================================
   SVG ВОДЫ
========================================================= */

function straightWater(){

    return `

    <svg
        class="water-layer"
        viewBox="0 0 100 100">

        <path
            class="water-path"
            d="M50 -5 L50 105">
        </path>

    </svg>

    `;

}


function cornerWater(){

    return `

    <svg
        class="water-layer"
        viewBox="0 0 100 100">

        <path
            class="water-path"
            d="
                M50 -5
                L50 50
                L105 50
            ">
        </path>

    </svg>

    `;

}


/* =========================================================
   ИНДИКАТОР
========================================================= */

function updateLevelIndicator(){

    levelText.textContent=
        `Уровень ${currentLevel+1} из ${levels.length}`;


    dots.innerHTML="";


    for(let i=0;i<levels.length;i++){

        const dot=
            document.createElement(
                "div"
            );

        dot.className="dot";


        if(i===currentLevel){

            dot.classList.add(
                "active"
            );

        }


        dots.appendChild(
            dot
        );

    }

}


/* =========================================================
   КАРТОЧКИ
========================================================= */

function createCards(level){

    leftPanel.innerHTML="";
    rightPanel.innerHTML="";

    /* Количество картинок равно количеству труб:
       уровень 1 = 6, уровень 2 = 8, уровень 3 = 10.
       Половина карточек слева, половина справа. */

    const count=level.required.length;
    const half=count/2;

    for(let cardIndex=0; cardIndex<count; cardIndex++){

        const card=document.createElement("div");

        card.className="speech-card";
        card.dataset.card=cardIndex;

        card.innerHTML=`
            <div class="card-cover">?</div>
            <div class="card-emoji">
                ${pictures[cardIndex] || "⭐"}
            </div>
        `;

        if(cardIndex<half){
            leftPanel.appendChild(card);
        }else{
            rightPanel.appendChild(card);
        }
    }
}


/* =========================================================
   СОЗДАНИЕ УРОВНЯ
========================================================= */

function createGame(){

    const level=
        levels[currentLevel];


    running=false;

    completed=false;

    rotations={};


    win.classList.remove(
        "show"
    );


    board.innerHTML="";


    updateLevelIndicator();

    createCards(level);

    document.querySelectorAll(".speech-card").forEach(card=>{
        if(level.required.length===8){
            card.style.maxHeight="112px";
            card.style.minHeight="62px";
        }else if(level.required.length===10){
            card.style.maxHeight="90px";
            card.style.minHeight="52px";
        }
    });


    /* =========================
       РАЗМЕР ПОЛЯ
    ========================= */

    const cellSize =
        level.cols >= 5
        ? "clamp(92px,8.4vw,132px)"
        : "clamp(105px,10vw,150px)";

    board.style.gridTemplateColumns=
        `repeat(${level.cols}, ${cellSize})`;

    board.style.gridTemplateRows=
        `repeat(${level.rows}, ${cellSize})`;


    level.cells.forEach(
        (item,index)=>{


            const cell=
                document.createElement(
                    "div"
                );


            cell.className="cell";

            cell.dataset.index=
                index;


            /* =================
               ПУСТО
            ================= */

            if(item.type==="empty"){

                cell.classList.add(
                    "empty"
                );


                board.appendChild(
                    cell
                );

                return;

            }


            /* =================
               КРАН
            ================= */

            if(item.type==="start"){

                cell.classList.add(
                    "endpoint",
                    "start"
                );


                cell.innerHTML=`

                    <div class="endpoint-box">

                        <img
                            src="${ASSETS.faucet}"
                            class="endpoint-picture"
                            alt=""
                            draggable="false"
                        >

                    </div>

                `;


                board.appendChild(
                    cell
                );

                return;

            }


            /* =================
               РОСТОК
            ================= */

            if(item.type==="finish"){

                cell.classList.add(
                    "endpoint",
                    "finish"
                );


                cell.innerHTML=`

                    <div class="endpoint-box">

                        <img
                            src="${ASSETS.plantStart}"
                            class="endpoint-picture plant"
                            id="plant"
                            alt=""
                            draggable="false"
                        >

                        <span class="splash s1"></span>
                        <span class="splash s2"></span>
                        <span class="splash s3"></span>
                        <span class="splash s4"></span>
                        <span class="splash s5"></span>

                    </div>

                `;


                board.appendChild(
                    cell
                );

                return;

            }


            /* =================
               ТРУБА
            ================= */

            const imagePath=
                item.type==="straight"
                ? ASSETS.straight
                : ASSETS.corner;


            const waterSVG=
                item.type==="straight"
                ? straightWater()
                : cornerWater();


            cell.innerHTML=`

                <img
                    src="${imagePath}"
                    class="pipe-image"
                    alt=""
                    draggable="false"
                >

                ${waterSVG}

            `;


            const pipeImage=
                cell.querySelector(
                    ".pipe-image"
                );


            const waterLayer=
                cell.querySelector(
                    ".water-layer"
                );


            /* =================
               СЛУЧАЙНЫЙ
               НЕПРАВИЛЬНЫЙ
               ПОВОРОТ
            ================= */

            let rotation;


            do{

                rotation=
                    Math.floor(
                        Math.random()*4
                    );

            }

            while(

                sameConnections(

                    getConnections(
                        item.type,
                        rotation
                    ),

                    item.target

                )

            );


            rotations[index]=
                rotation;


            setRotation(
                pipeImage,
                waterLayer,
                rotation
            );


            /* =================
               КЛИК
            ================= */

            cell.addEventListener(
                "click",
                ()=>{


                    if(
                        running ||
                        completed
                    ){

                        return;

                    }


                    rotations[index]=
                        (
                            rotations[index]+1
                        )%4;


                    setRotation(
                        pipeImage,
                        waterLayer,
                        rotations[index]
                    );


                    playClick();


                    updateCell(
                        index,
                        item
                    );


                    checkPath();

                }
            );


            board.appendChild(
                cell
            );

        }
    );

}


/* =========================================================
   ПОВОРОТ PNG + ВОДЫ
========================================================= */

function setRotation(
    image,
    water,
    rotation
){

    const degrees=
        rotation*90;


    image.style.transform=
        `rotate(${degrees}deg)`;


    water.style.transform=
        `rotate(${degrees}deg)`;

}


/* =========================================================
   ПРАВИЛЬНАЯ ТРУБА
========================================================= */

function updateCell(
    index,
    item
){

    const current=
        getConnections(
            item.type,
            rotations[index]
        );


    const correct=
        sameConnections(
            current,
            item.target
        );


    const cell=
        board.querySelector(
            `.cell[data-index="${index}"]`
        );


    cell.classList.toggle(
        "correct",
        correct
    );


    /* =========================
       КАРТИНКА ОТКРЫВАЕТСЯ
       ТОЛЬКО В ПРАВИЛЬНОМ
       ПОЛОЖЕНИИ
    ========================= */

    const card=
        Number.isInteger(item.card)
        ? document.querySelector(
            `.speech-card[data-card="${item.card}"]`
          )
        : null;


    if(card){

        card.classList.toggle(
            "revealed",
            correct
        );

    }

}


/* =========================================================
   СОСЕД
========================================================= */

function neighborIndex(
    index,
    direction,
    cols,
    rows
){

    const row=
        Math.floor(
            index/cols
        );


    const col=
        index%cols;


    if(direction==="N"){

        if(row===0){
            return null;
        }

        return index-cols;

    }


    if(direction==="S"){

        if(row===rows-1){
            return null;
        }

        return index+cols;

    }


    if(direction==="W"){

        if(col===0){
            return null;
        }

        return index-1;

    }


    if(direction==="E"){

        if(col===cols-1){
            return null;
        }

        return index+1;

    }


    return null;

}


/* =========================================================
   ПЕРВАЯ ТРУБА
========================================================= */

function firstPipeIndex(
    level
){

    return neighborIndex(

        level.startIndex,

        level.startDirection,

        level.cols,

        level.rows

    );

}


/* =========================================================
   РЕАЛЬНЫЙ ПУТЬ
========================================================= */

function tracePath(){

    const level=
        levels[currentLevel];


    let currentIndex=
        firstPipeIndex(
            level
        );


    let incoming=
        OPPOSITE[
            level.startDirection
        ];


    const visited=[];


    for(
        let safety=0;
        safety<40;
        safety++
    ){


        if(currentIndex===null){

            return null;

        }


        const item=
            level.cells[
                currentIndex
            ];


        if(!item){

            return null;

        }


        /* =================
           ФИНИШ
        ================= */

        if(
            item.type==="finish"
        ){

            if(
                incoming===
                level.finishIncoming
            ){

                return visited;

            }


            return null;

        }


        /* =================
           НЕ ТРУБА
        ================= */

        if(
            item.type!=="straight" &&
            item.type!=="corner"
        ){

            return null;

        }


        const connections=
            getConnections(
                item.type,
                rotations[currentIndex]
            );


        if(
            !connections.includes(
                incoming
            )
        ){

            return null;

        }


        visited.push(
            currentIndex
        );


        const outgoing=
            connections.find(
                direction=>
                    direction!==incoming
            );


        if(!outgoing){

            return null;

        }


        const next=
            neighborIndex(

                currentIndex,

                outgoing,

                level.cols,

                level.rows

            );


        if(next===null){

            return null;

        }


        if(
            visited.includes(
                next
            )
        ){

            return null;

        }


        incoming=
            OPPOSITE[
                outgoing
            ];


        currentIndex=
            next;

    }


    return null;

}


/* =========================================================
   ПРОВЕРКА ПОБЕДЫ
========================================================= */

function checkPath(){

    const level=
        levels[currentLevel];


    const path=
        tracePath();


    if(!path){

        return;

    }


    const complete=
        level.required.every(
            index=>
                path.includes(
                    index
                )
        );


    if(!complete){

        return;

    }


    running=true;


    /* открываем все карточки,
       если маршрут полностью готов */

    level.required.forEach(
        index=>{

            const item=
                level.cells[index];

            if(item){

                updateCell(
                    index,
                    item
                );

            }

        }
    );


    setTimeout(
        ()=>runWater(path),
        350
    );

}


/* =========================================================
   ВОДА
========================================================= */

function runWater(path){

    let step=0;


    function next(){

        if(
            step>=path.length
        ){

            reachFinish();

            return;

        }


        const index=
            path[step];


        const cell=
            board.querySelector(
                `.cell[data-index="${index}"]`
            );


        if(cell){

            cell.classList.add(
                "water-on"
            );

        }


        playWater();


        step++;


        setTimeout(
            next,
            520
        );

    }


    next();

}


/* =========================================================
   ЦВЕТОК ВЫРАСТАЕТ
========================================================= */

function reachFinish(){

    completed=true;


    const level=
        levels[currentLevel];


    const finishCell=
        board.querySelector(
            `.cell[data-index="${level.finishIndex}"]`
        );


    const plant=
        document.getElementById(
            "plant"
        );


    if(finishCell){

        finishCell.classList.add(
            "splash-on"
        );

    }


    playWater();


    setTimeout(
        ()=>{


            if(plant){

                plant.style.opacity="0";

                plant.style.transform=
                    "scale(.45)";


                setTimeout(
                    ()=>{


                        plant.src=
                            ASSETS.plantFinish;


                        plant.classList.add(
                            "growing"
                        );


                        plant.style.opacity="1";

                        plant.style.transform=
                            "scale(1)";


                        playWin();

                    },
                    220
                );

            }

        },
        250
    );


    /* Даём ребёнку увидеть,
       как вырос цветок,
       и только потом окно */

    setTimeout(
        ()=>showWin(),
        1900
    );

}


/* =========================================================
   ОКНО ПОБЕДЫ
========================================================= */

function showWin(){

    const lastLevel=
        currentLevel===
        levels.length-1;


    if(lastLevel){

        winTitle.textContent=
            "Все трубы починены!";

        winText.textContent=
            "Ты прошёл все 3 уровня!";

        nextButton.textContent=
            "Играть ещё раз";

    }

    else{

        winTitle.textContent=
            `Уровень ${currentLevel+1} пройден!`;

        winText.textContent=
            "Вода дошла до цветка!";

        nextButton.textContent=
            "Дальше →";

    }


    win.classList.add(
        "show"
    );

}


/* =========================================================
   ДАЛЬШЕ
========================================================= */

nextButton.addEventListener(
    "click",
    ()=>{


        if(
            currentLevel===
            levels.length-1
        ){

            currentLevel=0;

        }

        else{

            currentLevel++;

        }


        createGame();

    }
);


/* =========================================================
   ЗВУК
========================================================= */

let audioContext=null;


function getAudio(){

    if(!audioContext){

        audioContext=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    return audioContext;

}


/* =========================
   ЩЕЛЧОК
========================= */

function playClick(){

    try{

        const ctx=
            getAudio();


        const osc=
            ctx.createOscillator();


        const gain=
            ctx.createGain();


        osc.frequency.value=
            250;


        gain.gain.setValueAtTime(
            .035,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+.07
        );


        osc.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        osc.start();


        osc.stop(
            ctx.currentTime+.07
        );

    }

    catch(e){}

}


/* =========================
   ВОДА
========================= */

function playWater(){

    try{

        const ctx=
            getAudio();


        const osc=
            ctx.createOscillator();


        const gain=
            ctx.createGain();


        osc.type=
            "sine";


        osc.frequency.setValueAtTime(
            420,
            ctx.currentTime
        );


        osc.frequency.linearRampToValueAtTime(
            620,
            ctx.currentTime+.18
        );


        gain.gain.setValueAtTime(
            .025,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+.2
        );


        osc.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        osc.start();


        osc.stop(
            ctx.currentTime+.2
        );

    }

    catch(e){}

}


/* =========================
   ПОБЕДА
========================= */

function playWin(){

    try{

        const ctx=
            getAudio();


        const notes=[
            523,
            659,
            784,
            1046
        ];


        notes.forEach(
            (frequency,index)=>{


                const osc=
                    ctx.createOscillator();


                const gain=
                    ctx.createGain();


                osc.frequency.value=
                    frequency;


                gain.gain.value=
                    .055;


                osc.connect(
                    gain
                );


                gain.connect(
                    ctx.destination
                );


                const start=
                    ctx.currentTime+
                    index*.12;


                osc.start(
                    start
                );


                osc.stop(
                    start+.18
                );

            }
        );

    }

    catch(e){}

}


/* =========================================================
   ЗАПУСК
========================================================= */

createGame();

</script>
