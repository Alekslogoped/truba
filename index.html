<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Почини трубы!</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:#dff4ff;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:100vw;
    height:100vh;
    max-width:177.78vh;
    max-height:56.25vw;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:1.2vh 1.8vw;

    background:
        radial-gradient(circle at 50% 40%,
        #ffffff 0%,
        #eaf9ff 48%,
        #ccefff 100%);
}

/* ================= HEADER ================= */

.header{
    text-align:center;
    flex:0 0 auto;
}

.header h1{
    margin:0;
    color:#326f92;
    font-size:clamp(26px,2.7vw,46px);
    font-weight:900;
}

.header p{
    margin:.1em 0 .15em;
    color:#58768a;
    font-size:clamp(12px,1.1vw,17px);
    font-weight:700;
}

.level-info{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:.25em 0 .15em;
}

.level-text{
    color:#6b5ba7;
    font-weight:900;
    font-size:clamp(13px,1.15vw,18px);
}

.dots{
    display:flex;
    gap:6px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#d9cff2;
}

.dot.active{
    background:#7658b1;
    transform:scale(1.18);
}

/* ================= LAYOUT ================= */

.game-area{
    flex:1;
    min-height:0;

    display:grid;

    grid-template-columns:
        minmax(190px,1.15fr)
        minmax(600px,2.8fr)
        minmax(190px,1.15fr);

    gap:clamp(16px,2vw,34px);
    align-items:center;
}

.side-panel{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:clamp(8px,1.1vh,14px);
}

/* ================= CARDS ================= */

.speech-card{
    width:100%;
    max-width:225px;
    flex:1;
    max-height:145px;
    min-height:80px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    border-radius:25px;
    background:white;
    border:5px solid rgba(255,255,255,.95);

    box-shadow:
        0 9px 23px rgba(55,100,130,.15);

    transition:.35s;
}

.card-cover{
    position:absolute;
    inset:0;
    z-index:5;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(145deg,#d8caf7,#eee8ff);

    color:#7558ae;

    font-size:clamp(38px,4vw,68px);
    font-weight:900;

    transition:.35s;
}

.card-picture{
    font-size:clamp(42px,4.8vw,76px);

    opacity:0;
    transform:scale(.35);
    transition:.4s;
}

.speech-card.revealed{
    border-color:#83d49a;
    transform:scale(1.03);

    box-shadow:
        0 10px 27px rgba(60,155,90,.23);
}

.speech-card.revealed .card-cover{
    opacity:0;
    transform:scale(1.4);
}

.speech-card.revealed .card-picture{
    opacity:1;
    transform:scale(1);
    animation:picturePop .45s ease;
}

@keyframes picturePop{
    0%{transform:scale(.3);}
    70%{transform:scale(1.18);}
    100%{transform:scale(1);}
}

/* ================= CENTER ================= */

.center{
    height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    min-width:0;
}

/* ================= BOARD ================= */

.board{
    display:grid;

    gap:0;

    padding:22px;

    position:relative;

    background:rgba(255,255,255,.76);

    border-radius:34px;

    box-shadow:
        0 18px 42px rgba(50,100,130,.18);
}

.cell{
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:visible;

    cursor:pointer;

    background:rgba(255,255,255,.16);
}

.cell.empty{
    cursor:default;
}

.cell.correct{
    background:
        radial-gradient(
        circle,
        rgba(215,250,225,.72),
        rgba(255,255,255,.10));
}

/* ================= PIPES ================= */

.pipe-svg{
    width:100%;
    height:100%;

    overflow:visible;

    transition:transform .25s ease;

    pointer-events:none;
}

.pipe-base{
    fill:none;
    stroke:#467f9d;
    stroke-width:34;
    stroke-linecap:butt;
    stroke-linejoin:round;
}

.pipe-inner{
    fill:none;
    stroke:#b9e5f5;
    stroke-width:23;
    stroke-linecap:butt;
    stroke-linejoin:round;
}

.pipe-water{
    fill:none;
    stroke:#20b9ff;
    stroke-width:12;
    stroke-linecap:round;
    stroke-linejoin:round;

    opacity:0;

    filter:
        drop-shadow(0 0 5px rgba(30,180,255,.8));
}

.cell.water-on .pipe-water{
    opacity:1;
    stroke-dasharray:18 10;
    animation:waterMove .5s linear infinite;
}

@keyframes waterMove{
    from{stroke-dashoffset:28;}
    to{stroke-dashoffset:0;}
}

/* ================= ENDPOINTS ================= */

.endpoint{
    cursor:default;
    z-index:5;
}

.endpoint-box{
    width:90%;
    height:90%;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    border-radius:24px;
    background:white;

    box-shadow:
        0 8px 20px rgba(50,100,130,.15);
}

.endpoint-icon{
    font-size:clamp(40px,4.5vw,68px);
}

.endpoint-label{
    position:absolute;
    bottom:5px;

    font-size:clamp(9px,.75vw,13px);
    font-weight:900;
}

.start .endpoint-box{
    border:4px solid #8ad49b;
}

.start .endpoint-label{
    color:#438557;
}

.finish .endpoint-box{
    border:4px solid #ffd16d;
}

.finish .endpoint-label{
    color:#a97824;
}

.hint{
    margin-top:1vh;

    padding:.5em 1.4em;

    background:rgba(255,255,255,.78);

    border-radius:999px;

    color:#55778b;

    font-size:clamp(12px,1.1vw,17px);
    font-weight:700;
}

/* ================= WIN ================= */

.win{
    position:absolute;
    inset:0;

    z-index:100;

    display:none;
    justify-content:center;
    align-items:center;

    background:rgba(220,246,255,.75);
    backdrop-filter:blur(7px);
}

.win.show{
    display:flex;
}

.win-card{
    width:min(65%,600px);

    padding:3.5vh 4vw;

    text-align:center;

    background:white;

    border-radius:36px;

    box-shadow:
        0 20px 55px rgba(50,90,120,.22);

    animation:winPop .45s ease;
}

@keyframes winPop{
    from{
        opacity:0;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.win-icon{
    font-size:clamp(55px,7vw,95px);
}

.win h2{
    margin:.1em 0;
    color:#377c9f;
    font-size:clamp(28px,3.6vw,52px);
}

.win p{
    color:#627b89;

    font-size:clamp(14px,1.5vw,21px);

    font-weight:700;
}

.win button{
    border:0;

    padding:.8em 2.4em;

    border-radius:999px;

    background:
        linear-gradient(135deg,#6cc5e9,#369bc8);

    color:white;

    font-size:clamp(16px,1.6vw,22px);

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(55,120,155,.25);
}

@media(max-width:900px){

    .game-area{
        grid-template-columns:115px 1fr 115px;
        gap:7px;
    }

    .speech-card{
        max-width:140px;
    }

    .board{
        padding:10px;
    }
}

</style>
</head>

<body>

<main class="game">

    <div class="header">

        <h1>🔧 Почини трубы!</h1>

        <p>
            Поворачивай трубы и проведи воду от крана к цветку
        </p>

        <div class="level-info">

            <span
                class="level-text"
                id="levelText">
                Уровень 1 из 4
            </span>

            <div
                class="dots"
                id="dots">
            </div>

        </div>

    </div>


    <div class="game-area">

        <div
            class="side-panel"
            id="leftPanel">
        </div>


        <div class="center">

            <div
                class="board"
                id="board">
            </div>

            <div class="hint">
                💡 Нажимай на трубы, чтобы их поворачивать
            </div>

        </div>


        <div
            class="side-panel"
            id="rightPanel">
        </div>

    </div>


    <div
        class="win"
        id="win">

        <div class="win-card">

            <div
                class="win-icon"
                id="winIcon">
                💦🌻
            </div>

            <h2 id="winTitle">
                Уровень пройден!
            </h2>

            <p id="winText">
                Вода дошла до цветка!
            </p>

            <button id="nextButton">
                Дальше →
            </button>

        </div>

    </div>

</main>


<script>

/* =========================================================
   НАПРАВЛЕНИЯ
========================================================= */

const DIRS=["N","E","S","W"];

const OPPOSITE={
    N:"S",
    E:"W",
    S:"N",
    W:"E"
};


/* =========================================================
   РЕЧЕВЫЕ КАРТИНКИ

   ПОКА ТЕСТОВЫЕ.
   ПОТОМ ЗАМЕНИМ НА PNG.
========================================================= */

const pictures=[
    "🎈",
    "🐭",
    "🚗",
    "🧢",
    "🐱",
    "🛞",
    "🧥"
];


/* =========================================================
   4 УРОВНЯ

   Все поля 4 × 3.

   path — реальный путь воды.

   В каждой трубе:
   type
   target
   card
========================================================= */

const levels=[
{cols:4,rows:3,startIndex:0,startDirection:"E",finishIndex:11,finishIncoming:"N",required:[1,2,6,7],cells:[
{type:"start"},{type:"straight",target:["W","E"],card:0},{type:"corner",target:["W","S"],card:1},{type:"empty"},
{type:"empty"},{type:"empty"},{type:"corner",target:["N","E"],card:2},{type:"corner",target:["W","S"],card:3},
{type:"empty"},{type:"empty"},{type:"empty"},{type:"finish"}]},
{cols:4,rows:3,startIndex:0,startDirection:"E",finishIndex:7,finishIncoming:"S",required:[1,2,6,10,11],cells:[
{type:"start"},{type:"straight",target:["W","E"],card:0},{type:"corner",target:["W","S"],card:1},{type:"empty"},
{type:"empty"},{type:"empty"},{type:"straight",target:["N","S"],card:2},{type:"finish"},
{type:"empty"},{type:"empty"},{type:"corner",target:["N","E"],card:3},{type:"corner",target:["W","N"],card:4}]},
{cols:4,rows:3,startIndex:0,startDirection:"E",finishIndex:4,finishIncoming:"E",required:[1,2,3,7,6,5],cells:[
{type:"start"},{type:"straight",target:["W","E"],card:0},{type:"straight",target:["W","E"],card:1},{type:"corner",target:["W","S"],card:2},
{type:"finish"},{type:"straight",target:["W","E"],card:5},{type:"straight",target:["W","E"],card:4},{type:"corner",target:["N","W"],card:3},
{type:"empty"},{type:"empty"},{type:"empty"},{type:"empty"}]},
{cols:4,rows:3,startIndex:0,startDirection:"E",finishIndex:8,finishIncoming:"E",required:[1,2,3,7,11,10,9],cells:[
{type:"start"},{type:"straight",target:["W","E"],card:0},{type:"straight",target:["W","E"],card:1},{type:"corner",target:["W","S"],card:2},
{type:"empty"},{type:"empty"},{type:"empty"},{type:"straight",target:["N","S"],card:3},
{type:"finish"},{type:"straight",target:["W","E"],card:6},{type:"straight",target:["W","E"],card:5},{type:"corner",target:["N","W"],card:4}]}
];


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentLevel=0;

let rotations={};

let running=false;

let completed=false;


/* =========================================================
   DOM
========================================================= */

const board=
    document.getElementById("board");

const leftPanel=
    document.getElementById("leftPanel");

const rightPanel=
    document.getElementById("rightPanel");

const win=
    document.getElementById("win");

const levelText=
    document.getElementById("levelText");

const dots=
    document.getElementById("dots");

const winIcon=
    document.getElementById("winIcon");

const winTitle=
    document.getElementById("winTitle");

const winText=
    document.getElementById("winText");

const nextButton=
    document.getElementById("nextButton");


/* =========================================================
   НАПРАВЛЕНИЯ
========================================================= */

function rotateDirection(direction,rotation){

    const index=
        DIRS.indexOf(direction);

    return DIRS[
        (index+rotation)%4
    ];

}


function getConnections(type,rotation){

    let base;

    if(type==="straight"){

        base=["N","S"];

    }else{

        base=["N","E"];

    }

    return base.map(
        dir=>rotateDirection(
            dir,
            rotation
        )
    );

}


function sameConnections(a,b){

    return(
        a.length===b.length &&
        a.every(
            direction=>
                b.includes(direction)
        )
    );

}


/* =========================================================
   SVG
========================================================= */

function straightSVG(){

    return `

    <svg
        class="pipe-svg"
        viewBox="0 0 100 100">

        <path
            class="pipe-base"
            d="M50 -5 L50 105">
        </path>

        <path
            class="pipe-inner"
            d="M50 -5 L50 105">
        </path>

        <path
            class="pipe-water"
            d="M50 -5 L50 105">
        </path>

    </svg>

    `;

}


function cornerSVG(){

    return `

    <svg
        class="pipe-svg"
        viewBox="0 0 100 100">

        <path
            class="pipe-base"
            d="
                M50 -5
                L50 50
                L105 50
            ">
        </path>

        <path
            class="pipe-inner"
            d="
                M50 -5
                L50 50
                L105 50
            ">
        </path>

        <path
            class="pipe-water"
            d="
                M50 -5
                L50 50
                L105 50
            ">
        </path>

    </svg>

    `;

}


/* =========================================================
   ИНДИКАТОР
========================================================= */

function updateLevelIndicator(){

    levelText.textContent=
        `Уровень ${currentLevel+1} из 4`;

    dots.innerHTML="";

    for(let i=0;i<4;i++){

        const dot=
            document.createElement("div");

        dot.className="dot";

        if(i===currentLevel){

            dot.classList.add("active");

        }

        dots.appendChild(dot);

    }

}


/* =========================================================
   КАРТОЧКИ
========================================================= */

function createCards(level){

    leftPanel.innerHTML="";
    rightPanel.innerHTML="";

    const pipeItems=
        level.cells.filter(
            item=>
                item.type==="straight" ||
                item.type==="corner"
        );

    const count=
        pipeItems.length;

    const leftCount=
        Math.ceil(count/2);


    pipeItems.forEach(
        (item,index)=>{

            const card=
                document.createElement(
                    "div"
                );

            card.className=
                "speech-card";

            card.dataset.card=
                item.card;

            card.innerHTML=`

                <div class="card-cover">
                    ?
                </div>

                <div class="card-picture">
                    ${pictures[item.card] || "⭐"}
                </div>

            `;


            if(index<leftCount){

                leftPanel.appendChild(card);

            }else{

                rightPanel.appendChild(card);

            }

        }
    );

}


/* =========================================================
   СОЗДАНИЕ УРОВНЯ
========================================================= */

function createGame(){

    const level=
        levels[currentLevel];


    running=false;
    completed=false;

    rotations={};


    win.classList.remove("show");

    board.innerHTML="";


    updateLevelIndicator();

    createCards(level);


    /* размер поля */

    board.style.gridTemplateColumns=
        `repeat(${level.cols},clamp(105px,10vw,150px))`;

    board.style.gridTemplateRows=
        `repeat(${level.rows},clamp(105px,10vw,150px))`;


    level.cells.forEach(
        (item,index)=>{


            const cell=
                document.createElement(
                    "div"
                );

            cell.className="cell";

            cell.dataset.index=index;


            /* EMPTY */

            if(item.type==="empty"){

                cell.classList.add("empty");

                board.appendChild(cell);

                return;

            }


            /* START */

            if(item.type==="start"){

                cell.classList.add(
                    "endpoint",
                    "start"
                );

                cell.innerHTML=`

                    <div class="endpoint-box">

                        <div class="endpoint-icon">
                            🚰
                        </div>

                        <div class="endpoint-label">
                            СТАРТ
                        </div>

                    </div>

                `;

                board.appendChild(cell);

                return;

            }


            /* FINISH */

            if(item.type==="finish"){

                cell.classList.add(
                    "endpoint",
                    "finish"
                );

                cell.innerHTML=`

                    <div class="endpoint-box">

                        <div
                            class="endpoint-icon"
                            id="flower">
                            🌱
                        </div>

                        <div class="endpoint-label">
                            ФИНИШ
                        </div>

                    </div>

                `;

                board.appendChild(cell);

                return;

            }


            /* PIPE */

            cell.innerHTML=
                item.type==="straight"
                ? straightSVG()
                : cornerSVG();


            const svg=
                cell.querySelector(
                    ".pipe-svg"
                );


            /*
            Начальное положение
            обязательно неправильное.
            */

            let rotation;

            do{

                rotation=
                    Math.floor(
                        Math.random()*4
                    );

            }
            while(
                sameConnections(
                    getConnections(
                        item.type,
                        rotation
                    ),
                    item.target
                )
            );


            rotations[index]=rotation;


            svg.style.transform=
                `rotate(${rotation*90}deg)`;


            cell.addEventListener(
                "click",
                ()=>{


                    if(running || completed){
                        return;
                    }


                    rotations[index]=
                        (rotations[index]+1)%4;


                    svg.style.transform=
                        `rotate(${rotations[index]*90}deg)`;


                    playClick();


                    updateCell(
                        index,
                        item
                    );


                    checkPath();

                }
            );


            board.appendChild(cell);

        }
    );

}


/* =========================================================
   ПРАВИЛЬНАЯ ТРУБА
========================================================= */

function updateCell(index,item){

    const current=
        getConnections(
            item.type,
            rotations[index]
        );


    const correct=
        sameConnections(
            current,
            item.target
        );


    const cell=
        board.querySelector(
            `.cell[data-index="${index}"]`
        );


    cell.classList.toggle(
        "correct",
        correct
    );


    const card=
        document.querySelector(
            `.speech-card[data-card="${item.card}"]`
        );


    if(card){

        card.classList.toggle(
            "revealed",
            correct
        );

    }

}


/* =========================================================
   СОСЕД
========================================================= */

function neighborIndex(
    index,
    direction,
    cols,
    rows
){

    const row=
        Math.floor(index/cols);

    const col=
        index%cols;


    if(direction==="N"){

        if(row===0) return null;

        return index-cols;

    }


    if(direction==="S"){

        if(row===rows-1) return null;

        return index+cols;

    }


    if(direction==="W"){

        if(col===0) return null;

        return index-1;

    }


    if(direction==="E"){

        if(col===cols-1) return null;

        return index+1;

    }


    return null;

}


/* =========================================================
   НАЧАЛЬНАЯ ТРУБА
========================================================= */

function firstPipeIndex(level){

    return neighborIndex(
        level.startIndex,
        level.startDirection,
        level.cols,
        level.rows
    );

}


/* =========================================================
   ПРОВЕРКА НАСТОЯЩЕГО ПУТИ
========================================================= */

function tracePath(){

    const level=
        levels[currentLevel];


    let currentIndex=
        firstPipeIndex(level);


    let incoming=
        OPPOSITE[
            level.startDirection
        ];


    const visited=[];


    for(let safety=0;safety<40;safety++){

        if(currentIndex===null){
            return null;
        }


        const item=
            level.cells[
                currentIndex
            ];


        if(!item){
            return null;
        }


        /* FINISH */

        if(item.type==="finish"){

            if(
                incoming===
                level.finishIncoming
            ){

                return visited;

            }

            return null;

        }


        /* NOT PIPE */

        if(
            item.type!=="straight" &&
            item.type!=="corner"
        ){

            return null;

        }


        const connections=
            getConnections(
                item.type,
                rotations[currentIndex]
            );


        if(
            !connections.includes(
                incoming
            )
        ){

            return null;

        }


        visited.push(
            currentIndex
        );


        const outgoing=
            connections.find(
                direction=>
                    direction!==incoming
            );


        if(!outgoing){
            return null;
        }


        const next=
            neighborIndex(
                currentIndex,
                outgoing,
                level.cols,
                level.rows
            );


        if(next===null){
            return null;
        }


        if(
            visited.includes(next)
        ){

            return null;

        }


        incoming=
            OPPOSITE[outgoing];


        currentIndex=
            next;

    }


    return null;

}


/* =========================================================
   ПРОВЕРКА ПОБЕДЫ
========================================================= */

function checkPath(){

    const level=
        levels[currentLevel];


    const path=
        tracePath();


    if(!path){
        return;
    }


    const complete=
        level.required.every(
            index=>
                path.includes(index)
        );


    if(!complete){
        return;
    }


    running=true;


    setTimeout(
        ()=>runWater(path),
        350
    );

}


/* =========================================================
   ВОДА
========================================================= */

function runWater(path){

    let step=0;


    function next(){

        if(step>=path.length){

            reachFinish();

            return;

        }


        const index=
            path[step];


        const cell=
            board.querySelector(
                `.cell[data-index="${index}"]`
            );


        if(cell){

            cell.classList.add(
                "water-on"
            );

        }


        playWater();


        step++;


        setTimeout(
            next,
            520
        );

    }


    next();

}


/* =========================================================
   ФИНИШ УРОВНЯ
========================================================= */

function reachFinish(){

    completed=true;


    const flower=
        document.getElementById(
            "flower"
        );


    if(flower){

        flower.textContent="🌻";

        flower.animate(

            [
                {transform:"scale(.5)"},
                {transform:"scale(1.5)"},
                {transform:"scale(1)"}
            ],

            {
                duration:700
            }

        );

    }


    playWin();


    setTimeout(
        ()=>showWin(),
        900
    );

}


/* =========================================================
   ОКНО ПОБЕДЫ
========================================================= */

function showWin(){

    const lastLevel=
        currentLevel===
        levels.length-1;


    if(lastLevel){

        winIcon.textContent=
            "🏆💦🌻";

        winTitle.textContent=
            "Все трубы починены!";

        winText.textContent=
            "Ты прошёл все 4 уровня!";

        nextButton.textContent=
            "Играть ещё раз";

    }

    else{

        winIcon.textContent=
            "💦🌻";

        winTitle.textContent=
            `Уровень ${currentLevel+1} пройден!`;

        winText.textContent=
            "Вода дошла до цветка!";

        nextButton.textContent=
            "Дальше →";

    }


    win.classList.add(
        "show"
    );

}


/* =========================================================
   КНОПКА ДАЛЬШЕ
========================================================= */

nextButton.addEventListener(
    "click",
    ()=>{


        if(
            currentLevel===
            levels.length-1
        ){

            currentLevel=0;

        }

        else{

            currentLevel++;

        }


        createGame();

    }
);


/* =========================================================
   ЗВУК
========================================================= */

let audioContext=null;


function getAudio(){

    if(!audioContext){

        audioContext=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;

}


function playClick(){

    try{

        const ctx=getAudio();

        const osc=
            ctx.createOscillator();

        const gain=
            ctx.createGain();


        osc.frequency.value=250;


        gain.gain.setValueAtTime(
            .035,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+.07
        );


        osc.connect(gain);

        gain.connect(ctx.destination);


        osc.start();

        osc.stop(
            ctx.currentTime+.07
        );

    }

    catch(e){}

}


function playWater(){

    try{

        const ctx=getAudio();

        const osc=
            ctx.createOscillator();

        const gain=
            ctx.createGain();


        osc.frequency.setValueAtTime(
            420,
            ctx.currentTime
        );


        osc.frequency.linearRampToValueAtTime(
            620,
            ctx.currentTime+.18
        );


        gain.gain.setValueAtTime(
            .025,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime+.2
        );


        osc.connect(gain);

        gain.connect(ctx.destination);


        osc.start();

        osc.stop(
            ctx.currentTime+.2
        );

    }

    catch(e){}

}


function playWin(){

    try{

        const ctx=getAudio();

        const notes=[
            523,
            659,
            784,
            1046
        ];


        notes.forEach(
            (frequency,index)=>{


                const osc=
                    ctx.createOscillator();

                const gain=
                    ctx.createGain();


                osc.frequency.value=
                    frequency;


                gain.gain.value=.06;


                osc.connect(gain);

                gain.connect(
                    ctx.destination
                );


                const start=
                    ctx.currentTime+
                    index*.12;


                osc.start(start);

                osc.stop(
                    start+.18
                );

            }
        );

    }

    catch(e){}

}


/* =========================================================
   START
========================================================= */

createGame();
